<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Köy Hayatı 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bc8e8;font-family:Arial,sans-serif}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 4px #222}
#brand{position:absolute;left:18px;top:16px;background:#17251c99;padding:10px 14px;border-radius:10px;font-weight:bold;letter-spacing:.4px}
#hint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:#18251dcc;padding:12px 18px;border-radius:10px;font-size:14px;text-align:center}
#cross{position:absolute;left:50%;top:50%;width:8px;height:8px;border:1px solid #fff;border-radius:50%;transform:translate(-50%,-50%);opacity:.8}
#start{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#10251c88,#10251ccc);color:#fff;text-align:center;z-index:5}
#panel{max-width:520px;padding:30px;background:#17251ddd;border:1px solid #ffffff33;border-radius:18px;box-shadow:0 18px 60px #0006}
button{border:0;border-radius:10px;padding:13px 22px;background:#d2a65b;color:#211b12;font-weight:bold;font-size:16px;cursor:pointer}
small{color:#d8e2d6;line-height:1.7}
</style>
</head>
<body>
<div id="start"><div id="panel"><h1>🌿 KÖY HAYATI 3D</h1><p>Güneşli bir Anadolu köyünde yeni hayatın başlıyor.</p><p><button id="play">KÖYE GİR</button></p><small>W A S D: yürü · Fare: etrafa bak · E: araca bin / in · Shift: koş · ESC: fareyi serbest bırak</small></div></div>
<div id="hud"><div id="brand">KÖY HAYATI 3D <span id="mode">· YAYA</span></div><div id="cross"></div><div id="hint">WASD ile yürü · E ile araçlara yaklaş</div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc8e8);scene.fog=new THREE.Fog(0x9bc8e8,65,190);
const camera=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,.1,300);camera.position.set(0,1.7,10);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe7f4ff,0x77704a,2));
const sun=new THREE.DirectionalLight(0xffe4b5,2.5);sun.position.set(-25,40,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-65;sun.shadow.camera.right=65;sun.shadow.camera.top=65;sun.shadow.camera.bottom=-65;scene.add(sun);
const mat=(c,r=.9)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const M={grass:mat(0x71894c),dirt:mat(0x9a805e),stone:mat(0x9b9587),wall:mat(0xd0c1a1),roof:mat(0x8f4933),wood:mat(0x684a30),dark:mat(0x282b29),glass:new THREE.MeshStandardMaterial({color:0x9dbbc0,roughness:.25,metalness:.15}),red:mat(0x9d3023),yellow:mat(0xb78b28),rubber:mat(0x20211f),white:mat(0xd5d3c9),green:mat(0x476b36)};
function box(parent,x,y,z,w,h,d,material,rot=0){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.position.set(x,y,z);o.rotation.y=rot;o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function cyl(parent,x,y,z,r1,r2,h,material,seg=12){const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg),material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function ground(){const g=new THREE.Mesh(new THREE.PlaneGeometry(260,260),M.grass);g.rotation.x=-Math.PI/2;g.position.y=-.08;g.receiveShadow=true;scene.add(g);box(scene,0,.005,2,42,.06,35,M.dirt);box(scene,0,.01,-19,90,.08,8,M.dirt)}
ground();
// hills and mountain silhouettes
for(let i=0;i<18;i++){const a=new THREE.Mesh(new THREE.ConeGeometry(10+Math.random()*9,15+Math.random()*18,7),mat(i%2?0x71805d:0x85866c));a.position.set(-75+i*9,5,-72-Math.random()*18);a.scale.z=.75;a.castShadow=true;scene.add(a)}
// house, front faces courtyard (+z)
box(scene,-13,2.1,-10,13,4.2,9,M.wall);
box(scene,-13,4.35,-10,13.5,.35,9.5,M.wood);
const roof1=new THREE.Mesh(new THREE.ConeGeometry(8.4,3.3,4),M.roof);roof1.scale.set(1,.55,.68);roof1.rotation.y=Math.PI/4;roof1.position.set(-13,5.15,-10);roof1.castShadow=true;scene.add(roof1);
box(scene,-13,2.2,-5.35,13,.18,.15,M.wood);
for(let x=-18;x<=-8;x+=2.5){box(scene,x,2.6,-5.22,.12,1.1,.12,M.wood)}
// windows, door, balcony
box(scene,-17,2.25,-5.28,1.5,1.8,.12,M.wood);box(scene,-17,2.25,-5.18,1.25,1.55,.08,M.glass);
box(scene,-10,1.25,-5.25,1.1,2.4,.18,M.wood);
box(scene,-13,3.25,-5.2,2.4,1.1,.14,M.dark);box(scene,-13,3.85,-5.1,2.6,.12,.45,M.wood);
for(let x=-14.1;x<=-11.9;x+=.35)box(scene,x,3.55,-4.9,.07,.6,.07,M.wood);
box(scene,-7.3,2.7,-5.18,1.1,1.3,.1,M.glass);
for(let x=-7.8;x<=-6.8;x+=.25)box(scene,x,2.7,-5.08,.06,1.5,.08,M.wood);
// Turkish flag simple red cloth with crescent/star approximated
box(scene,-6.1,3.15,-5.15,1.15,1.6,.04,mat(0xb51f2a));
cyl(scene,-6.3,3.2,-5.1,.28,.28,.025,mat(0xffffff),24);cyl(scene,-6.22,3.27,-5.07,.23,.23,.03,mat(0xb51f2a),24);
// garage/workshop attached at right
box(scene,1.5,2.1,-10,9,4.2,9,M.wood);box(scene,1.5,4.25,-10,9.5,.3,9.5,M.roof);
box(scene,1.5,1.8,-5.38,6.7,3.5,.16,M.dark);box(scene,1.5,1.8,-5.25,6.2,3.2,.08,mat(0x35332c));
box(scene,4.4,1.1,-5.15,.7,2.2,.2,M.red);box(scene,4.4,2.35,-5.1,.8,.18,.3,M.dark);
box(scene,-1.4,.8,-5.15,1.2,1.6,.18,M.dark);
for(let i=0;i<4;i++)box(scene,-.8+i*.7,.2,-5.05,.4,.35,.2,M.yellow);
// garage roof supports and tools
for(let x=-3;x<=6;x+=9)box(scene,x,2,-5.35,.22,4,.22,M.wood);
box(scene,1,.5,-9,2,.9,.7,M.dark);
// tree
function tree(x,z,s=1){cyl(scene,x,2*s,z,.38*s,.55*s,4*s,M.wood);for(let i=0;i<5;i++){const t=new THREE.Mesh(new THREE.IcosahedronGeometry(2.2*s,1),mat(i%2?0x426b38:0x557b3e));t.position.set(x+(Math.random()-.5)*2*s,4.3*s+i*.35*s,z+(Math.random()-.5)*2*s);t.castShadow=true;scene.add(t)}}
tree(-25,1,1.35);tree(12,-1,1.1);tree(22,-18,1.4);tree(-32,-20,1.2);
for(let x=-30;x<30;x+=2.3){box(scene,x,.55,10,.12,1.1,.12,M.wood);box(scene,x,.2,10,.18,.15,.18,M.wood)}
box(scene,0,.7,10,62,.12,.12,M.wood);box(scene,0,.35,10,62,.12,.12,M.wood);
// utility poles
for(const [x,z] of [[-4,-25],[17,-28],[30,-5]]){cyl(scene,x,5,z,.12,.16,10,M.wood);box(scene,x,9.5,z,3,.12,.12,M.wood)}
// distant minaret
cyl(scene,19,4,-36,.55,.75,8,M.wall);cyl(scene,19,9,-36,.38,.55,2,M.wall);const sp=new THREE.Mesh(new THREE.ConeGeometry(.38,2,8),M.dark);sp.position.set(19,11,-36);scene.add(sp);
// vehicle builder, all face +z, wheels on sides
function vehicle(type,x,z,color){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);const body=mat(color),wheel= M.rubber;
if(type==='tractor'){box(g,0,.95,0,2.6,.75,3.5,body);box(g,0,1.9,-.45,1.65,1.3,1.8,M.glass);box(g,0,2.62,-.45,1.8,.13,2.0,M.dark);box(g,0,1.2,1.5,1.2,.65,.5,M.dark);for(const s of [-1,1]){for(const zz of [-1.1,1.15]){const r=zz<0?.78:.52;const w=new THREE.Mesh(new THREE.CylinderGeometry(r,r,.38,16),wheel);w.rotation.z=Math.PI/2;w.position.set(s*1.25,r,zz);w.castShadow=true;g.add(w)}}box(g,0,1.5,-1.5,.12,1.4,.12,M.dark)}
else if(type==='grader'){box(g,0,1,0,2.5,.7,4.6,body);box(g,0,2,-.8,1.55,1.3,1.7,M.glass);box(g,0,.55,.55,3,.12,1.3,M.yellow);for(const s of [-1,1])for(const zz of [-1.5,1.5]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.62,.62,.4,16),wheel);w.rotation.z=Math.PI/2;w.position.set(s*1.25,.62,zz);g.add(w)}}
else if(type==='truck'){box(g,0,.95,-.2,2.8,1.4,4.2,body);box(g,0,1.8,1.25,2.6,1.7,1.5,M.glass);box(g,0,2.8,-.4,2.9,.18,3.7,M.red);for(const s of [-1,1])for(const zz of [-1.5,1.3]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.58,.58,.42,16),wheel);w.rotation.z=Math.PI/2;w.position.set(s*1.35,.58,zz);g.add(w)}}
else{box(g,0,.8,0,2.2,.65,4.2,body);box(g,0,1.45,-.35,1.85,1.0,2.15,M.glass);box(g,0,1.1,2.05,1.9,.35,.12,M.dark);for(const s of [-1,1])for(const zz of [-1.35,1.35]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.28,16),wheel);w.rotation.z=Math.PI/2;w.position.set(s*1.08,.42,zz);g.add(w)}}
g.userData={type,drive:false};return g}
const vehicles=[vehicle('tractor',9,-.7,0xa43124),vehicle('grader',17,-.8,0xb38b2c),vehicle('truck',27,-.6,0x9c3027),vehicle('car',-21,2,0xc9c8bd)];
// trailer behind truck
box(vehicles[2],0,1,-3.7,3.2,1.8,3.8,mat(0x9b3027));for(const s of [-1,1])for(const z of [-4.7,-2.7]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.32,14),M.rubber);w.rotation.z=Math.PI/2;w.position.set(s*1.55,.48,z);vehicles[2].add(w)}
// courtyard clutter and barrels
for(let i=0;i<5;i++){cyl(scene,-3+i*.75,.55,-3,.32,.32,1.1,i%2?M.red:M.yellow,12)}
// controls
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE')interact()});addEventListener('keyup',e=>keys[e.code]=false);
let yaw=0,pitch=0,locked=false,active=null;const start=document.getElementById('start'),hint=document.getElementById('hint'),mode=document.getElementById('mode');
document.getElementById('play').onclick=()=>{renderer.domElement.requestPointerLock();start.style.display='none'};
document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===renderer.domElement);
document.addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*.0022;pitch-=e.movementY*.0022;pitch=Math.max(-1.35,Math.min(1.35,pitch))});
function interact(){if(active){active=null;mode.textContent='· YAYA';hint.textContent='Araçtan indin · E ile tekrar binebilirsin';return}let best=null,dist=5;for(const v of vehicles){const d=camera.position.distanceTo(new THREE.Vector3(v.position.x,1,v.position.z));if(d<dist){best=v;dist=d}}if(best){active=best;mode.textContent='· '+({tractor:'TRAKTÖR',grader:'GREYDER',truck:'KAMYON',car:'TEMPRA'}[best.userData.type]);hint.textContent='WASD: aracı sür · E: araçtan in'}else hint.textContent='Araca binmek için yanına yaklaş'}
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);if(locked){camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0);const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));let move=new THREE.Vector3();if(keys.KeyW)move.add(forward);if(keys.KeyS)move.sub(forward);if(keys.KeyD)move.add(right);if(keys.KeyA)move.sub(right);if(move.lengthSq())move.normalize();const speed=(keys.ShiftLeft?8:4.4)*dt;
if(active){active.position.addScaledVector(move,speed*1.5);active.rotation.y=yaw;camera.position.set(active.position.x,2.2,active.position.z+1.0);hint.textContent='Aracı kullanıyorsun · E ile in'}
else{camera.position.addScaledVector(move,speed);camera.position.y=1.7;camera.position.x=Math.max(-42,Math.min(42,camera.position.x));camera.position.z=Math.max(-42,Math.min(30,camera.position.z));if(move.lengthSq()===0)hint.textContent='WASD ile yürü · E ile araçlara bin'}}
renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
